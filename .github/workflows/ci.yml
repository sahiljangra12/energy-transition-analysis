name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]" -c requirements-lock.txt

      - name: Lint
        run: ruff check src tests app.py

      - name: Tests
        run: pytest -q

      - name: Results are reproducible
        # Rebuilds the clean data, results and dashboard from the raw API responses
        # and fails if anything differs from the committed files.
        run: python -m energy_transition --check
